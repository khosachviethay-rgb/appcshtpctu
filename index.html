    <script>
      (function() {
        // 1. Define setter on window and prototype chain to safely handle assignment to window.fetch
        try {
          var targets = [window];
          if (typeof Window !== 'undefined' && Window.prototype) targets.push(Window.prototype);
          if (window.__proto__) targets.push(window.__proto__);

          var currentFetch = window.fetch;
          var customFetch = undefined;

          var getter = function() {
            return customFetch !== undefined ? customFetch : currentFetch;
          };
          var setter = function(fn) {
            customFetch = fn;
          };

          for (var i = 0; i < targets.length; i++) {
            var target = targets[i];
            if (!target) continue;
            try {
              Object.defineProperty(target, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          }
        } catch (e) {}

        // 2. Global error listener to suppress benign unhandled fetch setter error
        window.addEventListener('error', function(e) {
          if (e && e.message && typeof e.message === 'string' && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg) {
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
            return true;
          }
          if (prevOnError) return prevOnError.apply(this, arguments);
          return false;
        };
      })();
    </script>
